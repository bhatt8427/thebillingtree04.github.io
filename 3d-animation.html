<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Digital Tree | The Billing Tree</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a3a5f 0%, #0a1128 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a1128;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="loader" id="loader">
        <div style="color: white; font-size: 18px; letter-spacing: 5px;">INITIALIZING SYSTEM...</div>
    </div>

    <div id="ui-overlay">
        <div class="title">The Billing Tree</div>
        <div class="subtitle">AI-POWERED REVENUE CYCLE MANAGEMENT</div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer, controls;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        let pulses = [];

        const init = () => {
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a1128, 0.002);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 400;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Post Processing
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, 0.4, 0.85
            );
            bloomPass.threshold = 0.1;
            bloomPass.strength = 1.0;
            bloomPass.radius = 0.1;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ffff, 10, 500);
            pointLight.position.set(0, 50, 50);
            scene.add(pointLight);

            // Background Grid
            const gridHelper = new THREE.GridHelper(1000, 20, 0x4cc9f0, 0x1a3a5f);
            gridHelper.position.y = -150;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);

            // Blueprint Circles
            for (let i = 0; i < 5; i++) {
                const geom = new THREE.RingGeometry(150 + i * 50, 151 + i * 50, 64);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0x4cc9f0,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(geom, mat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = -140;
                scene.add(ring);
            }

            // Background Particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 2000;
            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 1000;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 2,
                color: 0x4cc9f0,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // Digital Tree (Circuit Style)
            const createTree = (pos, dir, length, width, depth) => {
                if (depth <= 0) return;

                const end = pos.clone().add(dir.clone().multiplyScalar(length));

                const points = [pos, end];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 1.0,
                    linewidth: 2
                });
                const line = new THREE.Line(geometry, material);
                scene.add(line);

                // Add circular nodes at branch ends with strong glow
                const nodeGeom = new THREE.SphereGeometry(depth > 4 ? 0.8 : 2, 16, 16);
                const nodeMat = new THREE.MeshBasicMaterial({
                    color: depth % 2 === 0 ? 0x00ffff : 0xffffff
                });
                const node = new THREE.Mesh(nodeGeom, nodeMat);
                node.position.copy(end);
                scene.add(node);

                // Create branches with more "ordered" angles
                const numBranches = Math.floor(Math.random() * 2) + 1;
                for (let i = 0; i < numBranches; i++) {
                    const angle = (i === 0 ? -0.4 : 0.4) + (Math.random() - 0.5) * 0.2;
                    const newDir = dir.clone().applyEuler(new THREE.Euler(
                        angle,
                        (Math.random() - 0.5) * 0.5,
                        angle * 0.5
                    )).normalize();
                    createTree(end, newDir, length * 0.75, width * 0.7, depth - 1);
                }
            };

            const treeRoot = new THREE.Vector3(0, -180, 0);
            const treeDir = new THREE.Vector3(0, 1, 0);
            createTree(treeRoot, treeDir, 100, 4, 7);

            // Circuit Background Lines
            for (let i = 0; i < 30; i++) {
                const points = [];
                const startX = (Math.random() - 0.5) * 800;
                const startY = (Math.random() - 0.5) * 600;
                const startZ = -200;
                points.push(new THREE.Vector3(startX, startY, startZ));
                points.push(new THREE.Vector3(startX + (Math.random() - 0.5) * 100, startY + (Math.random() - 0.5) * 100, startZ));

                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({ color: 0x1a3a5f, transparent: true, opacity: 0.3 });
                const circuitLine = new THREE.Line(geom, mat);
                scene.add(circuitLine);
            }

            // Data Pulses
            const createPulse = (parentLine) => {
                const geometry = new THREE.SphereGeometry(1.2, 8, 8);
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const pulse = new THREE.Mesh(geometry, material);

                const points = parentLine.geometry.attributes.position.array;
                const start = new THREE.Vector3(points[0], points[1], points[2]);
                const end = new THREE.Vector3(points[3], points[4], points[5]);

                pulse.position.copy(start);
                scene.add(pulse);

                pulses.push({
                    mesh: pulse,
                    start: start,
                    end: end,
                    progress: 0,
                    speed: 0.01 + Math.random() * 0.02
                });
            };

            // Trigger pulses periodically
            setInterval(() => {
                const lines = [];
                scene.traverse(child => { if (child.isLine) lines.push(child); });
                if (lines.length > 0) {
                    const randomLine = lines[Math.floor(Math.random() * lines.length)];
                    createPulse(randomLine);
                }
            }, 500);

            // 3D Bar Chart
            const createBarChart = (pos) => {
                const group = new THREE.Group();
                for (let i = 0; i < 8; i++) {
                    const h = 10 + Math.random() * 40;
                    const geom = new THREE.BoxGeometry(5, h, 5);
                    const mat = new THREE.MeshPhongMaterial({
                        color: 0x4cc9f0,
                        transparent: true,
                        opacity: 0.7,
                        emissive: 0x4cc9f0,
                        emissiveIntensity: 0.5
                    });
                    const bar = new THREE.Mesh(geom, mat);
                    bar.position.set(i * 10, h / 2, 0);
                    group.add(bar);
                }
                group.position.set(...pos);
                scene.add(group);
                return group;
            };

            const barChart1 = createBarChart([-250, -100, 50]);
            const barChart2 = createBarChart([150, -80, -50]);
            const barChart3 = createBarChart([-180, 100, -100]);

            // Advanced UI Panels
            const createUIPanel = (width, height, drawFn, pos) => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                drawFn(ctx, width, height);

                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.9 });
                const sprite = new THREE.Sprite(mat);
                sprite.position.set(...pos);
                sprite.scale.set(width / 4, height / 4, 1);
                scene.add(sprite);

                sprite.userData = {
                    originalY: pos[1],
                    floatSpeed: 0.001 + Math.random() * 0.001,
                    floatOffset: Math.random() * Math.PI * 2
                };
            };

            // Medical Checklist Panel
            createUIPanel(256, 384, (ctx, w, h) => {
                ctx.fillStyle = 'rgba(26, 58, 95, 0.4)';
                ctx.roundRect(0, 0, w, h, 20);
                ctx.fill();
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Header
                ctx.fillStyle = '#00ff00';
                ctx.font = 'Bold 40px Inter';
                ctx.fillText('+', 20, 50);
                ctx.font = '24px Inter';
                ctx.fillText('CHECKLIST', 60, 48);

                // Items
                for (let i = 0; i < 5; i++) {
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(30, 100 + i * 50, 20, 20);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillText('✓', 32, 118 + i * 50);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(70, 110 + i * 50, 150, 4);
                }
            }, [-250, 50, 100]);

            // Calculator Panel
            createUIPanel(200, 256, (ctx, w, h) => {
                ctx.fillStyle = 'rgba(26, 58, 95, 0.6)';
                ctx.roundRect(0, 0, w, h, 15);
                ctx.fill();
                ctx.strokeStyle = '#4cc9f0';
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.font = '20px Inter';
                ctx.fillText('CALC', 20, 35);

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 3; c++) {
                        ctx.fillStyle = 'rgba(76, 201, 240, 0.3)';
                        ctx.fillRect(20 + c * 55, 60 + r * 45, 45, 35);
                    }
                }
            }, [-220, -120, 50]);

            // Shield Panel (Security)
            createUIPanel(160, 200, (ctx, w, h) => {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
                ctx.beginPath();
                ctx.moveTo(w / 2, 20);
                ctx.bezierCurveTo(w, 20, w, h * 0.8, w / 2, h - 20);
                ctx.bezierCurveTo(0, h * 0.8, 0, 20, w / 2, 20);
                ctx.fill();
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.fillStyle = '#00ff00';
                ctx.font = 'Bold 60px Inter';
                ctx.textAlign = 'center';
                ctx.fillText('✓', w / 2, h / 2 + 20);
            }, [250, 0, 120]);

            // Data Charts Panel (Candlestick Style)
            createUIPanel(320, 200, (ctx, w, h) => {
                ctx.fillStyle = 'rgba(26, 58, 95, 0.5)';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#4cc9f0';
                ctx.strokeRect(0, 0, w, h);

                for (let i = 0; i < 10; i++) {
                    const x = 30 + i * 28;
                    const y = 80 + Math.random() * 40;
                    ctx.fillStyle = Math.random() > 0.5 ? '#00ff00' : '#ff4d4d';
                    ctx.fillRect(x, y, 10, 40);
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y - 10);
                    ctx.lineTo(x + 5, y + 50);
                    ctx.stroke();
                }
            }, [220, 120, -50]);

            // Performance Stats (Bottom Right)
            createUIPanel(300, 150, (ctx, w, h) => {
                ctx.fillStyle = 'rgba(26, 58, 95, 0.4)';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#4cc9f0';
                ctx.strokeRect(0, 0, w, h);

                for (let i = 0; i < 15; i++) {
                    ctx.fillStyle = '#4cc9f0';
                    ctx.fillRect(20 + i * 18, h - 20 - Math.random() * 80, 12, 80);
                }
            }, [200, -150, 80]);

            // Handle Resize
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onDocumentMouseMove);

            // Finish Loading
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1500);

            animate();
        };

        const onWindowResize = () => {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        };

        const onDocumentMouseMove = (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.05;
            mouseY = (event.clientY - windowHalfY) * 0.05;
        };

        const animate = () => {
            requestAnimationFrame(animate);

            controls.update();

            // Animate Pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.progress += p.speed;
                p.mesh.position.lerpVectors(p.start, p.end, p.progress);
                if (p.progress >= 1) {
                    scene.remove(p.mesh);
                    pulses.splice(i, 1);
                }
            }

            // Animate Icons
            scene.traverse(child => {
                if (child.isSprite && child.userData.floatSpeed) {
                    const ud = child.userData;
                    child.position.y = ud.originalY + Math.sin(Date.now() * ud.floatSpeed + ud.floatOffset) * 15;
                }
            });

            // Subtle mouse parallax
            camera.position.x += (mouseX - camera.position.x) * 0.01;
            camera.position.y += (-mouseY - camera.position.y) * 0.01;
            camera.lookAt(scene.position);

            composer.render();
            // renderer.render(scene, camera);
        };

        init();
    </script>
</body>

</html>
